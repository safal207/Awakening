name: First Memory CI

on:
  push:
    branches:
      - "feat/first-memory-slice"
      - "feat/memory-anchor-persistence"
      - "feat/first-memory-spatial"
      - "fix/dayloop-awareness"
      - "feat/stable-resident-id"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Functional tests
        run: dotnet run --configuration Release --no-build -- --functional-test

      - name: Save and memory self-tests
        run: dotnet run --configuration Release --no-build -- --self-test

      - name: First memory spatial smoke
        run: dotnet run --project tests/FirstMemorySpatialSmoke/FirstMemorySpatialSmoke.csproj --configuration Release

      - name: Stable resident identity smoke
        run: dotnet run --project tests/StableResidentIdSmoke/StableResidentIdSmoke.csproj --configuration Release
